# Dependabot: weekly dependency and GitHub Actions updates. Security
# updates (for Dependabot alerts) are switched on in the repository
# settings and follow the same rules below.
#
# Commit messages stay Conventional Commits: Cargo updates are
# `fix(deps): ...` so release-please ships them, Actions updates are
# `ci(deps): ...`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      # The Matrix crates move together, at every version step: matrix-sdk
      # has breaking changes in most releases and is pinned exactly from
      # Phase 3 (PLAN.md, section 12). A dependency goes to the first group
      # it matches, so this one comes first. rusqlite (and so
      # libsqlite3-sys, which links SQLite once per build) must stay on the
      # line matrix-sdk-sqlite uses (ADR 0003), so it moves with them.
      matrix:
        patterns:
          - "matrix-sdk"
          - "matrix-sdk-*"
          - "ruma"
          - "ruma-*"
          - "rusqlite"
          - "libsqlite3-sys"
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # GPUI is pinned to a Zed stable release tag (ADR 0002,
      # docs/upstream/zed.md); the zed-upstream workflow owns it.
      - dependency-name: gpui
      - dependency-name: gpui_platform

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
