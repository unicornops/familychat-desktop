name: Release Asset Backfill

# Rebuilds and uploads the Windows release assets (the zip and the MSI) for
# an existing tagged release, replaces their lines in the release's
# SHA256SUMS and attests the new files (ADR 0014). Used when a release
# job failed after the other assets were already published. The steps
# follow release-please.yml's Windows job; tags from before Phase 12 have
# no MSI and cannot be backfilled with this version.
on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "The existing tag to rebuild Windows assets for (e.g. v0.1.0)"
                required: true
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    backfill-windows-assets:
        runs-on: windows-latest
        steps:
            - name: Checkout release commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.release_tag }}

            # The tag's own rust-toolchain.toml names the toolchain it was
            # released with.
            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}

            - name: Build release binaries
              run: cargo build -p familychat-app --release --locked

            - name: Install cargo-about
              run: cargo install cargo-about --locked --features cli

            - name: Generate THIRD_PARTY.html and stage the licences
              shell: bash
              run: |
                  cargo about generate --locked --fail about.hbs -o THIRD_PARTY.html
                  scripts/stage-licences.sh target/dist/licences

            - name: Check for Azure Artifact Signing
              id: azure
              shell: bash
              env:
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
                  SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
                  SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
                  SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
              run: |
                  set -euo pipefail
                  present=0
                  for value in "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_CLIENT_SECRET" "$SIGNING_ENDPOINT" "$SIGNING_ACCOUNT" "$SIGNING_PROFILE"; do
                    [ -n "$value" ] && present=$((present + 1))
                  done
                  if [ "$present" -eq 6 ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  elif [ "$present" -eq 0 ]; then
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::Azure Artifact Signing is not configured; the Windows files are unsigned."
                  else
                    echo "::error::Only $present of the six Azure Artifact Signing secrets are set (see docs/release.md)"
                    exit 1
                  fi

            - name: Sign the Windows executables
              if: steps.azure.outputs.enabled == 'true'
              uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
              with:
                  azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
                  endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
                  signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
                  certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
                  files: |
                      ${{ github.workspace }}\target\release\familychat.exe
                      ${{ github.workspace }}\target\release\familychat-launcher.exe
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256

            - name: Create the Windows archive and MSI
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force archive | Out-Null
                  Copy-Item "target/release/familychat.exe" archive/
                  Copy-Item -Recurse target/dist/licences/* archive/
                  Compress-Archive -Path archive/* -DestinationPath "familychat-windows-x86_64.zip"
                  Copy-Item packaging/windows/familychat.ico target/dist/
                  cargo install cargo-wix --version 0.3.9 --locked
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  cargo wix -p familychat-app --no-build --nocapture --output familychat-windows-x86_64.msi
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Sign the MSI
              if: steps.azure.outputs.enabled == 'true'
              uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
              with:
                  azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
                  endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
                  signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
                  certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
                  files: ${{ github.workspace }}\familychat-windows-x86_64.msi
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256
                  description: Family Chat
                  description-url: https://github.com/unicornops/familychat-desktop

            # The release's SHA256SUMS keeps every other file's line; the two
            # Windows lines are replaced with the new files'.
            - name: Update SHA256SUMS
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  gh release download "${{ inputs.release_tag }}" --pattern SHA256SUMS --output SHA256SUMS.old
                  grep -v -E '  familychat-windows-x86_64\.(zip|msi)$' SHA256SUMS.old > SHA256SUMS || true
                  sha256sum familychat-windows-x86_64.zip familychat-windows-x86_64.msi >> SHA256SUMS
                  sort -k2 SHA256SUMS -o SHA256SUMS
                  diff SHA256SUMS.old SHA256SUMS || true
                  sha256sum familychat-windows-x86_64.zip familychat-windows-x86_64.msi > SHA256SUMS-windows

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-checksums: SHA256SUMS-windows

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: gh release upload "${{ inputs.release_tag }}" familychat-windows-x86_64.zip familychat-windows-x86_64.msi SHA256SUMS --clobber
