name: Release Please

# Merging to main opens or updates the release pull request; merging that
# tags the release, and the asset jobs attach the platform archives.
#
# Pull requests that change this workflow or the notices run the asset
# jobs as a dry run: the archives are built and uploaded as workflow
# artefacts, never attached to a release. A manual run builds a given tag
# (or, with dry_run, any ref) the same way.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/release-please.yml
      - about.toml
      - about.hbs
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag or branch to build (e.g. v0.1.0) - skips release-please and runs the asset build only"
        required: true
        type: string
      dry_run:
        description: "Build the archives without uploading them to the release (for testing release changes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['crates/familychat-app--release_created'] }}
      release_sha: ${{ steps.release.outputs['crates/familychat-app--sha'] }}
      tag_name: ${{ steps.release.outputs['crates/familychat-app--tag_name'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Release PRs opened with the default GITHUB_TOKEN do not trigger
          # CI; RELEASE_PLEASE_TOKEN, when configured, does.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  complete_release_changelog:
    name: Complete Release Changelog
    needs: release_please
    if: github.event_name == 'push' && needs.release_please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main with history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Render or complete the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: scripts/render-release-pr.sh

  # THIRD_PARTY.html: the licences of every crate in the binary, for all
  # three platforms (about.toml's targets), generated once and packed into
  # each archive.
  third_party_notices:
    name: Third-Party Notices
    needs: release_please
    if: |
      always() &&
      (needs.release_please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.release_sha || inputs.tag_name || github.sha }}

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Generate THIRD_PARTY.html
        run: cargo about generate --locked --fail about.hbs -o THIRD_PARTY.html

      - name: Upload the notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD_PARTY.html
          if-no-files-found: error

  build_release_assets:
    needs:
      - release_please
      - third_party_notices
    if: |
      always() && needs.third_party_notices.result == 'success' &&
      (needs.release_please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'pull_request')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: familychat-linux-x86_64
            artifact_path: familychat-linux-x86_64.tar.gz
            binary_name: familychat
          - os: macos-latest
            archive_name: familychat-macos
            artifact_path: familychat-macos.tar.gz
            binary_name: familychat
          - os: windows-latest
            archive_name: familychat-windows-x86_64
            artifact_path: familychat-windows-x86_64.zip
            binary_name: familychat.exe
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run builds the tag it was started with, a pull request
          # its own head; otherwise the release tag's commit.
          ref: ${{ needs.release_please.outputs.release_sha || inputs.tag_name || github.sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

      - name: Read the pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ runner.os }}-

      - name: Build release binary
        run: cargo build -p familychat-app --release --locked

      - name: Download the notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices

      # The archives carry Family Chat's licence, THIRD_PARTY.html (the
      # crates' licences) and the notices that must travel with every copy
      # of what the binary embeds: the Inter font's SIL OFL 1.1 (Linux
      # builds) and Lucide's ISC/MIT.
      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p archive/licenses
          cp "target/release/${{ matrix.binary_name }}" LICENSE THIRD_PARTY.html archive/
          cp assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
          cp assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
          tar -czf "${{ matrix.artifact_path }}" -C archive .
          tar -tzvf "${{ matrix.artifact_path }}"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force archive/licenses | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}", LICENSE, THIRD_PARTY.html archive/
          Copy-Item assets/fonts/inter/LICENSE.txt archive/licenses/Inter-OFL.txt
          Copy-Item assets/icons/LICENSE.txt archive/licenses/Lucide-LICENSE.txt
          Compress-Archive -Path archive/* -DestinationPath "${{ matrix.artifact_path }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "${{ matrix.artifact_path }}")).Entries |
            ForEach-Object { "{0,12}  {1}" -f $_.Length, $_.FullName }

      # The archived binary runs and names its version.
      - name: Check the archived binary
        shell: bash
        run: archive/${{ matrix.binary_name }} --version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.artifact_path }}

      - name: Upload release asset
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets="${{ matrix.artifact_path }}"
          sha256sum $assets > "SHA256SUMS-${{ runner.os }}"
          gh release upload "${{ needs.release_please.outputs.tag_name || inputs.tag_name }}" $assets "SHA256SUMS-${{ runner.os }}" --clobber
