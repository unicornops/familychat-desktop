name: CI

# Branch pushes are covered by their pull request's run, so a push runs CI
# only on main. A newer push to a pull request cancels its older run.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            app_code: ${{ steps.detect.outputs.app_code }}
            workspace_checks: ${{ steps.detect.outputs.workspace_checks }}
            ui: ${{ steps.detect.outputs.ui }}

        steps:
            - name: Checkout
              if: github.event_name == 'pull_request'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect app code changes
              id: detect
              shell: bash
              run: |
                  if [[ "${{ github.event_name }}" != "pull_request" ]]; then
                    echo "app_code=true" >> "$GITHUB_OUTPUT"
                    echo "workspace_checks=true" >> "$GITHUB_OUTPUT"
                    echo "ui=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  app_code=false
                  workspace_checks=false
                  ui=false
                  while IFS= read -r file; do
                    [[ -z "$file" ]] && continue

                    # UI changes get the screenshot matrix (ui_screenshots):
                    # the window, its theme and assets, the fixtures and the
                    # sentences the screens show.
                    case "$file" in
                      crates/familychat-ui/*|crates/familychat-theme/*|crates/familychat-assets/*|themes/*|assets/icons/*|assets/fonts/*|crates/familychat-app/src/ui_fixture.rs|crates/familychat-test-support/src/fixtures.rs|crates/familychat-test-support/src/fixtures/*|crates/familychat-core/src/signin.rs|crates/familychat-core/src/encryption.rs|crates/familychat-core/src/timeline.rs|crates/familychat-core/src/startup.rs|crates/familychat-core/src/commands.rs|crates/familychat-core/src/sync.rs|crates/familychat-signin/src/wording.rs|scripts/capture-ui-screenshots.sh|.github/workflows/ci.yml)
                        if [[ "$file" != *.md ]]; then
                          ui=true
                        fi
                        ;;
                    esac

                    case "$file" in
                      Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|.github/workflows/ci.yml|scripts/window-smoke.*|scripts/keychain-session.sh)
                        app_code=true
                        workspace_checks=true
                        ;;
                      crates/*|themes/*|assets/*)
                        if [[ "$file" != *.md ]]; then
                          app_code=true
                          workspace_checks=true
                        fi
                        ;;
                      about.toml|about.hbs|deny.toml|scripts/homeserver-harness.sh|scripts/check-release-features.sh|scripts/check-dependency-boundaries.sh|scripts/capture-ui-screenshots.sh)
                        workspace_checks=true
                        ;;
                      # The packaging (ADR 0014): the identifiers test in
                      # familychat-app and the scripts' lint and tests.
                      packaging/*|scripts/*.sh)
                        workspace_checks=true
                        ;;
                      docker/homeserver-harness/*)
                        if [[ "$file" != *.md ]]; then
                          workspace_checks=true
                        fi
                        ;;
                    esac
                  done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")

                  echo "app_code=$app_code" >> "$GITHUB_OUTPUT"
                  echo "workspace_checks=$workspace_checks" >> "$GITHUB_OUTPUT"
                  echo "ui=$ui" >> "$GITHUB_OUTPUT"

    quality:
        needs: changes
        if: github.event_name != 'pull_request' || needs.changes.outputs.workspace_checks == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Linux build dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev

            # rust-toolchain.toml follows the toolchain Zed pins for the GPUI
            # tag (docs/upstream/zed.md), so CI reads it instead of
            # repeating the version here.
            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}
                  components: rustfmt, clippy

            # The GPUI git dependency clones the whole Zed repository
            # (~400 MB); keep Cargo's git database between runs.
            - name: Cache Cargo git dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/git/db
                  key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-git-${{ runner.os }}-

            - name: Install cargo-deny
              run: cargo install cargo-deny --locked

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Install cargo-about
              run: cargo install cargo-about --locked --features cli

            - name: Format
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings

            - name: Policy
              run: cargo deny check licenses advisories bans sources

            - name: Advisory audit
              # If an advisory has no upstream fix reachable in the lock,
              # silence it inline with --ignore and link the reason here.
              # The pinned-stack advisories (all "unmaintained" warnings,
              # which cargo audit does not fail on) are listed in deny.toml,
              # which cargo deny enforces alongside in Policy.
              run: cargo audit

            # What every release archive carries as THIRD_PARTY.html: checked
            # here so a crate with a licence about.toml does not accept fails
            # the pull request, not the release.
            - name: Third-party notices
              run: cargo about generate --locked --fail about.hbs -o THIRD_PARTY.html

            - name: Workspace tests
              run: cargo test --workspace --locked

            # The screenshot fixtures (`launch-ui-fixture`) are behind an
            # opt-in feature the workspace run leaves off: their tests check
            # every view has a fixture and a screenshot in dark and light.
            - name: UI fixture tests
              run: cargo test -p familychat-app --features ui-fixture --locked

            - name: Clippy (UI fixtures)
              run: cargo clippy -p familychat-app --all-targets --features ui-fixture --locked -- -D warnings

            # familychat-test-support's `test-harness` feature trusts the
            # homeserver harness's throwaway CA (ADR 0004): no release build
            # of the app may reach it, on any target.
            - name: Release builds never enable the test harness
              run: scripts/check-release-features.sh

            # ADR 0001 and PLAN.md section 5.1: the frontends never depend on
            # the Matrix SDK or each other's toolkit, and familychat-core
            # exposes no SDK type.
            - name: Dependency boundaries
              run: scripts/check-dependency-boundaries.sh

            - name: Lint the scripts
              run: shellcheck scripts/*.sh

            # The release notes' signing section (ADR 0014): what it says for
            # signed, ad hoc and unsigned files, and the input it refuses.
            - name: Release script tests
              run: scripts/test-release-signing-notes.sh

            # The live homeserver harness (ADR 0004): Palpo at Family Chat's
            # image with its Postgres sidecar, Synapse, and the TLS front end.
            # DOCKERHUB_* are optional: the script logs in when they are
            # configured, so the Docker Hub pulls use a personal quota
            # instead of the runner pool's shared anonymous one.
            - name: Start the homeserver harness
              timeout-minutes: 15
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              run: scripts/homeserver-harness.sh up

            # The script's other commands, as a developer uses them. The
            # harness tokens are throwaway, but stay out of the log anyway.
            - name: Homeserver harness commands
              run: |
                  scripts/homeserver-harness.sh env | sed -E "s/(TOKEN=).*/\1'<redacted>'/"
                  scripts/homeserver-harness.sh create-user ci-smoke ci-smoke-password
                  scripts/homeserver-harness.sh mint-token ci-smoke 60000 >/dev/null
                  echo "mint-token: minted a login token for @ci-smoke"
                  scripts/homeserver-harness.sh create-mas-user ci-smoke ci-smoke-password
                  scripts/homeserver-harness.sh ps

            - name: Live homeserver harness tests
              timeout-minutes: 10
              run: cargo test -p familychat-test-support --test live_homeserver_harness --locked -- --ignored --nocapture

            # The Matrix session against the harness (ADR 0005): restore,
            # sync, rooms, the timeline and back-pagination on Palpo, the
            # suspended state, and refresh-token rotation on Synapse.
            - name: Live session tests
              timeout-minutes: 15
              run: cargo test -p familychat-session --test live_session --locked -- --ignored --nocapture

            # The sign-in against the harness (ADR 0006): a code redeemed and
            # replayed, a code for a non-allowlisted hs never sent and a
            # 307 never followed (both from the front end's access log), a
            # code for someone else signed out, the custom domain, and
            # another server's password sign-in on Synapse.
            - name: Live sign-in tests
              timeout-minutes: 15
              run: cargo test -p familychat-signin --test live_signin --locked -- --ignored --nocapture

            # The browser and QR code sign-ins against the harness (ADR
            # 0010): OAuth 2.0 on Synapse with MAS through a scripted
            # browser, its token refreshed and revoked; QR code sign-in
            # between two devices both ways (MSC4108); and neither offered
            # on Family Chat's Palpo.
            - name: Live browser and QR code sign-in tests
              timeout-minutes: 15
              run: cargo test -p familychat-signin --test live_oauth --locked -- --ignored --nocapture

            # The terminal UI's sign-in against the harness (ADR 0008): a
            # pasted code used only after y (checked in the access log) and
            # a typed password, driving the terminal UI's state over the
            # real sign-in and session; the invitation's hostile room name
            # comes back filtered.
            - name: Live terminal UI tests
              timeout-minutes: 15
              run: cargo test -p familychat-app --test live_tui_signin --locked -- --ignored --nocapture

            # The messaging actions against the harness (ADR 0012): send,
            # reply, edit, react and redact between two members; a message
            # sent with the front end stopped goes when it is back; a paused
            # account sends nothing until the pause ends; an over-limit file
            # refused before any upload (the access log); a photo uploaded
            # without its location; new direct chats encrypted.
            - name: Live messaging tests
              timeout-minutes: 15
              run: cargo test -p familychat-actions --test live_actions --locked -- --ignored --nocapture

            # End-to-end encryption against the harness (ADR 0009): two
            # devices verify by emoji and the new one reads the history;
            # recovery set up on one device lets a new one read it; a
            # code-only account makes its cross-signing identity on Palpo
            # (the outcome is printed for family-chat #257); room keys
            # exported and imported decrypt the history.
            - name: Live encryption tests
              timeout-minutes: 15
              run: cargo test -p familychat-session --test live_encryption --locked -- --ignored --nocapture

            - name: Homeserver harness logs
              if: failure()
              run: scripts/homeserver-harness.sh logs

            - name: Stop the homeserver harness
              if: always()
              run: scripts/homeserver-harness.sh down

    build:
        name: Build (${{ matrix.os }})
        needs:
            - changes
            - quality
        if: github.event_name != 'pull_request' || needs.changes.outputs.app_code == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact_name: familychat-linux
                      binary_path: target/release/familychat
                    - os: macos-latest
                      artifact_name: familychat-macos
                      binary_path: target/release/familychat
                    - os: windows-latest
                      artifact_name: familychat-windows
                      binary_path: target/release/familychat.exe

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The window smoke test runs the app under Xvfb: GPUI renders
            # through wgpu, which loads the Vulkan loader (libvulkan1) and,
            # failing that, EGL/GL at runtime; mesa-vulkan-drivers supplies
            # the lavapipe software Vulkan driver. The keychain steps run
            # against a throwaway Secret Service (scripts/keychain-session.sh),
            # which needs dbus-run-session and gnome-keyring.
            - name: Install Linux build and smoke test dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libvulkan1 libgl1 libegl1 libgl1-mesa-dri mesa-vulkan-drivers xvfb xdotool imagemagick dbus gnome-keyring

            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}
                  components: clippy

            - name: Cache Cargo git dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/git/db
                  key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-git-${{ runner.os }}-

            # The quality job lints and tests on Linux only. The platform
            # code (GPUI's backends, the bundled-font and Windows resource
            # cfgs, the terminal layer) differs per OS and can only be
            # compiled and run here.
            - name: Clippy (this platform)
              if: runner.os != 'Linux'
              run: cargo clippy --workspace --all-targets --locked -- -D warnings

            - name: Workspace tests (this platform)
              if: runner.os != 'Linux'
              run: cargo test --workspace --locked

            # The keychain tests the workspace run ignores, against the real
            # keychain of this platform: the login keychain on macOS,
            # Credential Manager on Windows, and a throwaway Secret Service
            # on Linux. They use a test-only service id.
            - name: Real keychain tests (this platform)
              timeout-minutes: 10
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == Linux ]]; then
                    scripts/keychain-session.sh cargo test -p familychat-security --locked -- --ignored real_keychain
                  else
                    cargo test -p familychat-security --locked -- --ignored real_keychain
                  fi

            - name: Build release binary
              run: cargo build -p familychat-app --release --locked

            - name: Version
              shell: bash
              run: ${{ matrix.binary_path }} --version

            # `familychat accounts` through the real path: the profile lock,
            # the platform keychain (a new app-store passphrase on the first
            # run, read back on the second) and the encrypted app store.
            - name: Profile smoke test
              timeout-minutes: 5
              shell: bash
              env:
                  FAMILYCHAT_DATA_DIR: ${{ runner.temp }}/familychat-profile
              run: |
                  # Both runs share one keychain (on Linux, one throwaway
                  # Secret Service session).
                  check='for attempt in first second; do
                    output="$("$0" accounts)" || exit 1
                    echo "$attempt run: $output"
                    [[ "$output" == "No accounts yet." ]] || exit 1
                  done'
                  if [[ "$RUNNER_OS" == Linux ]]; then
                    scripts/keychain-session.sh bash -c "$check" "${{ matrix.binary_path }}"
                  else
                    bash -c "$check" "${{ matrix.binary_path }}"
                  fi
                  ls -la "$FAMILYCHAT_DATA_DIR" "$FAMILYCHAT_DATA_DIR/logs"
                  [[ -f "$FAMILYCHAT_DATA_DIR/familychat.sqlite3" ]]

            # Tracked from Phase 0 (PLAN.md, section 12): GPUI with wgpu now,
            # matrix-sdk from Phase 3.
            - name: Record the binary size
              shell: bash
              run: |
                  bytes=$(wc -c < "${{ matrix.binary_path }}" | tr -d ' ')
                  echo "Release binary on ${{ runner.os }}: ${bytes} bytes ($((bytes / 1024 / 1024)) MiB)" | tee -a "$GITHUB_STEP_SUMMARY"

            # Opens the real window, checks it appears with its title, and
            # takes a screenshot (the window-smoke artefact).
            - name: Window smoke test (Linux)
              if: runner.os == 'Linux'
              timeout-minutes: 5
              run: xvfb-run -a --server-args="-screen 0 1280x800x24" bash scripts/window-smoke.sh "${{ matrix.binary_path }}" artifacts/window-smoke

            - name: Window smoke test (macOS)
              if: runner.os == 'macOS'
              timeout-minutes: 5
              run: bash scripts/window-smoke.sh "${{ matrix.binary_path }}" artifacts/window-smoke

            - name: Window smoke test (Windows)
              if: runner.os == 'Windows'
              timeout-minutes: 5
              shell: pwsh
              run: ./scripts/window-smoke.ps1 -App "${{ matrix.binary_path }}" -OutputDir artifacts/window-smoke

            - name: Upload the window smoke test
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: window-smoke-${{ runner.os }}
                  path: artifacts/window-smoke
                  if-no-files-found: ignore

            - name: Upload release binary
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.binary_path }}

    # The UI screenshot matrix (PLAN.md, section 9; Zmail's job): every
    # fixture view in dark and light, from a release build with the
    # `ui-fixture` feature, under Xvfb with openbox and lavapipe. Uploaded
    # as the `ui-screenshots` artefact for review on UI pull requests.
    ui_screenshots:
        name: UI Screenshots
        needs: changes
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true')
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # GPUI renders through wgpu, which loads the Vulkan loader
            # (libvulkan1) and, failing that, EGL/GL at runtime;
            # mesa-vulkan-drivers supplies the lavapipe software Vulkan
            # driver the headless capture uses.
            - name: Install Linux build and capture dependencies
              run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libvulkan1 libgl1 libegl1 libgl1-mesa-dri mesa-vulkan-drivers xvfb openbox xdotool imagemagick fonts-noto-color-emoji fonts-dejavu-core

            - name: Read the pinned Rust toolchain
              id: toolchain
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust
              uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
              with:
                  toolchain: ${{ steps.toolchain.outputs.channel }}

            - name: Cache Cargo git dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cargo/git/db
                  key: cargo-git-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-git-${{ runner.os }}-

            - name: Build the release binary with the UI fixtures
              run: cargo build -p familychat-app --release --locked --features ui-fixture

            - name: Capture the screenshot matrix
              env:
                  FAMILYCHAT_CAPTURE_LOG_DIR: ${{ runner.temp }}/ui-screenshot-logs
              run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bash scripts/capture-ui-screenshots.sh --matrix artifacts/ui-screenshots

            - name: Upload screenshots
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ui-screenshots
                  path: artifacts/ui-screenshots/*.png
                  if-no-files-found: error
                  retention-days: 30

            - name: Upload capture logs
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ui-screenshot-logs
                  path: ${{ runner.temp }}/ui-screenshot-logs
                  if-no-files-found: ignore
