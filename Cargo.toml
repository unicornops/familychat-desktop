[workspace]
members = [
    "crates/familychat-app",
    "crates/familychat-assets",
    "crates/familychat-core",
    "crates/familychat-security",
    "crates/familychat-session",
    "crates/familychat-store",
    "crates/familychat-test-support",
    "crates/familychat-theme",
    "crates/familychat-tui",
    "crates/familychat-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.98"
version = "0.0.1"

[workspace.dependencies]
anyhow = "1"
# The terminal UI's terminal layer: raw mode, the alternate screen, key,
# mouse and bracketed-paste events on Linux, macOS and Windows terminals.
# The version ratatui's backend uses.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
# The OS CSPRNG, for passphrases and account ids (PLAN.md, section 5.4).
# Already in the graph through GPUI.
getrandom = "0.4"
# GPUI is a git dependency on Zed pinned to a stable release tag (ADR 0002,
# docs/upstream/zed.md), never the crates.io `gpui` crate. The weekly
# `zed-upstream` workflow moves both lines; keep them on the same tag.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.27.0", default-features = false, features = ["font-kit", "wayland", "x11"] }
# Secrets live only in the OS keychain (PLAN.md, section 5.4): the macOS
# login keychain, Windows Credential Manager and the Secret Service on
# Linux. The version and features Zmail uses; 4.x is to be evaluated for
# both apps together.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# The SDK's store cipher (ChaCha20-Poly1305, keys hashed with keyed
# BLAKE3), for the identifying values in the app store (ADR 0003). Pinned
# exactly, and moved with the other Matrix crates (PLAN.md, section 4).
matrix-sdk-store-encryption = "=0.19.1"
# The Matrix client (ADR 0005): pinned exactly and moved together with
# matrix-sdk-ui, matrix-sdk-store-encryption and ruma (PLAN.md, section 4).
# Only what Family Chat uses: end-to-end encryption, the SQLite stores
# (SQLite built from source, as rusqlite's `bundled` does) and rustls with
# aws-lc-rs. No automatic room key forwarding (key requests to other
# devices are left to verification and backup, Phase 8), no native TLS.
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["bundled-sqlite", "e2e-encryption", "rustls-aws-lc-rs", "sqlite"] }
# SyncService, RoomListService and Timeline, on the same TLS provider.
matrix-sdk-ui = { version = "=0.19.1", default-features = false, features = ["rustls-aws-lc-rs"] }
# Matrix identifiers for familychat-core's view models: the ruma matrix-sdk
# 0.19.1 uses, without its API or events features. Moved with the Matrix
# crates.
ruma = { version = "=0.17.2", default-features = false }
# The terminal UI's drawing, on its crossterm backend; no optional widgets
# or macros.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
# HTTP for the live homeserver harness's test client
# (familychat-test-support); the line matrix-sdk 0.19 uses, on rustls with
# its default aws-lc-rs provider. No system proxy, cookies or native TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
# The app store (ADR 0003). libsqlite3-sys links SQLite once per build, so
# this must stay on the line matrix-sdk-sqlite uses (0.19.1 requires
# `^0.40.2`, libsqlite3-sys 0.38): move it only with the Matrix crates.
# `bundled` builds SQLite from source on every OS, as matrix-sdk's
# `bundled-sqlite` will from Phase 3.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Local logs only (PLAN.md, section 5.4): a plain-text formatter writing
# through the redacting writer in familychat-security, no ANSI, no env
# filter (its regex is not needed for `target=level` directives).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Account ids (`account-<uuid>` keychain entries, `accounts/<uuid>/`),
# built from OS random bytes, so no random-number feature is enabled.
uuid = { version = "1", default-features = false, features = ["std"] }
zeroize = "1.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Zed's root Cargo.toml patches these crates.io crates, but `[patch]` sections
# only apply to the workspace that declares them, so a git consumer of GPUI
# gets the unpatched crates.io releases unless it repeats the patches. We
# mirror the ones that change GPUI's own runtime behaviour: the async-task
# executor (gpui), the calloop event loop's idle budgeting (gpui_linux) and
# khronos-egl, so a failed EGL call that reports EGL_SUCCESS does not panic
# (wgpu's GL backend on Linux). Zed's other patches (cpal, tree-sitter,
# livekit, notify, async-process, windows-capture, crash-context, scratch)
# cover crates this build does not compile. The `zed-upstream` workflow
# re-syncs these revisions from the pinned tag.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
