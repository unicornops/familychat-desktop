accepted = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# THIRD_PARTY.html (`cargo about generate about.hbs`, which the release
# workflow runs) covers every platform the release builds for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# The workspace's own crates are this project, under LICENSE.
private = { ignore = true }
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Source files ported from other projects. cargo-about only lists crates,
# so these are recorded here; keep each file's header notice when editing.
#
# - crates/familychat-theme, crates/familychat-assets, the BackgroundRuntime
#   in crates/familychat-session, crates/familychat-ui/src/fonts.rs,
#   crates/familychat-tui/src/terminal.rs and crates/familychat-app/build.rs
#   are copied from Zmail (https://github.com/unicornops/zmail), Copyright
#   UnicornOps, GPL-3.0-only like this project.
#
# Nothing is copied from the Element X forks (AGPL-3.0); see PLAN.md,
# section 2.

# Bundled assets that are not crates, also recorded here:
#
# - assets/fonts/inter/Inter-{Regular,Medium,SemiBold,Bold}.ttf
#   Inter 4.1 (https://github.com/rsms/inter/releases/tag/v4.1, from
#   Inter-4.1.zip, sha256 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e),
#   Copyright The Inter Project Authors, licensed under the SIL Open Font
#   License 1.1 (assets/fonts/inter/LICENSE.txt). Copied from Zmail.
#   Embedded in Linux builds only (crates/familychat-assets); release
#   archives ship the licence as licenses/Inter-OFL.txt.
# - assets/icons/*.svg
#   Lucide (https://lucide.dev), licensed under the ISC License; the icons
#   Lucide derives from Feather are also under MIT (assets/icons/LICENSE.txt,
#   copied from the Lucide repository). A subset of Zmail's copy. Embedded
#   in all builds; release archives ship the licence as
#   licenses/Lucide-LICENSE.txt.
