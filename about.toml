accepted = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# THIRD_PARTY.html (`cargo about generate about.hbs`, which the release
# workflow runs) covers every platform the release builds for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# The workspace's own crates are this project, under LICENSE.
private = { ignore = true }
ignore-build-dependencies = false
ignore-dev-dependencies = true

# Source files ported from other projects. cargo-about only lists crates,
# so these are recorded here; keep each file's header notice when editing.
#
# - crates/familychat-theme, crates/familychat-assets, the BackgroundRuntime
#   (crates/familychat-session/src/runtime.rs) and the retry backoff
#   (crates/familychat-session/src/backoff.rs, from zmail-sync's backoff.rs)
#   in crates/familychat-session, crates/familychat-ui/src/fonts.rs,
#   crates/familychat-tui/src/terminal.rs and crates/familychat-app/build.rs
#   are copied from Zmail (https://github.com/unicornops/zmail), Copyright
#   UnicornOps, GPL-3.0-only like this project. scripts/homeserver-harness.sh
#   follows the structure of Zmail's scripts/proton-harness.sh (retry, the
#   throwaway TLS CA, the env file), same copyright and licence.
# - Adapted from Zmail in the same way: the keychain wrapper and the
#   passphrase handling (zmail-security's lib.rs and vault.rs) in
#   crates/familychat-security/src/keychain.rs and secret.rs; the crash log
#   hook (zmail-app's install_panic_log) in
#   crates/familychat-security/src/logging.rs; the data directory rules
#   (zmail-app's data_dir) in crates/familychat-store/src/paths.rs; the
#   lock and its two-process test (zmail-store's lock.rs) in
#   crates/familychat-store/src/lock.rs; the migrations (zmail-store's
#   apply_migrations) in crates/familychat-store/src/app_store.rs.
# - The window's component set and its foundations, copied from Zmail's
#   zmail-ui (Phase 5, ADR 0011), same copyright and licence; keep each
#   file's header notice: crates/familychat-ui/src/components/ (actions,
#   avatar, badge, banner, button, hit_target, kbd, menu, modal, popover,
#   scrollbar, test_support, text_input and its tests, theme, title_bar,
#   toast, tooltip, window_frame), src/styles.rs and src/styles/ (contrast,
#   high_contrast, platform, typography), src/a11y.rs, src/motion.rs,
#   src/widgets.rs and src/keymap.rs; src/command_palette.rs is adapted from
#   zmail-ui's, and crates/familychat-core/src/fuzzy.rs is copied from
#   zmail-core's. Three of the components are Zmail's ports from Zed
#   (https://github.com/zed-industries/zed), Copyright Zed Industries, Inc.:
#   - crates/familychat-ui/src/components/text_input.rs
#     Ported from crates/gpui/examples/input.rs in Zed v1.24.2, licensed
#     under the Apache License 2.0 (crates/familychat-ui/LICENSE-APACHE).
#   - crates/familychat-ui/src/components/title_bar.rs
#     Ported from crates/platform_title_bar in Zed v1.24.2, licensed under
#     GPL-3.0-or-later (used under GPL-3.0-only).
#   - crates/familychat-ui/src/components/window_frame.rs
#     Ported from client_side_decorations in crates/workspace
#     (GPL-3.0-or-later, used under GPL-3.0-only) and
#     crates/gpui/examples/window_shadow.rs (Apache License 2.0,
#     crates/familychat-ui/LICENSE-APACHE) in Zed v1.24.2.
# - Rooms and the timeline (Phase 6, ADR 0007), same copyright and licence;
#   keep each file's header notice. Copied from Zmail's zmail-security:
#   crates/familychat-security/src/matrix_html/elements.rs (src/html/
#   elements.rs), crates/familychat-security/src/file_names.rs
#   (src/attachment_safety.rs: the safe file name rules and their tests)
#   and the fixtures crates/familychat-security/tests/fixtures/hostile_html/
#   xss-vectors.html and mxss.html (tests/fixtures/hostile/). Adapted from
#   it: crates/familychat-security/src/matrix_html/prepass.rs (src/html/
#   prepass.rs), the tokenizer helper and the ammonia set-up in
#   crates/familychat-security/src/matrix_html/mod.rs (src/html/mod.rs and
#   text.rs), crates/familychat-security/tests/hostile_html.rs
#   (tests/hostile_corpus.rs). Adapted from Zmail's zmail-ui: the link
#   rules and the open-link dialog's wording in
#   crates/familychat-core/src/links.rs and the dialog in
#   crates/familychat-ui/src/rooms/mod.rs (src/reader/links.rs), the link
#   drawing in crates/familychat-ui/src/rooms/rich_text.rs
#   (src/reader/body.rs), and the benchmark
#   crates/familychat-ui/src/view_tests/perf.rs (src/view_tests/perf.rs).
# - The terminal UI (Phase 10, ADR 0008), same copyright and licence; keep
#   each file's header notice. Copied from Zmail's zmail-security:
#   crates/familychat-security/src/terminal.rs (src/terminal.rs) and
#   crates/familychat-security/tests/terminal_corpus.rs
#   (tests/terminal_corpus.rs). Copied from Zmail's zmail-tui:
#   crates/familychat-tui/src/text.rs (src/text.rs),
#   crates/familychat-tui/src/pane.rs (src/pane.rs, with a copy prefix
#   added) and crates/familychat-tui/src/clipboard.rs (src/clipboard.rs,
#   with its own settings type). Adapted from Zmail's zmail-tui:
#   crates/familychat-tui/src/palette.rs (src/palette.rs), the frame,
#   draw_pane, styled and the command bar in
#   crates/familychat-tui/src/view.rs (src/view.rs), the environment, the
#   effects, the mouse, selection and copy in
#   crates/familychat-tui/src/app.rs (src/app.rs), the run loop in
#   crates/familychat-tui/src/lib.rs (src/lib.rs), the OS opener in
#   crates/familychat-tui/src/links.rs (src/links.rs) and the snapshot
#   harness in crates/familychat-tui/src/tests.rs (src/tests.rs).
# - The terminal UI's writing (Phase 11, ADR 0008), same copyright and
#   licence; keep each file's header notice. Copied from Zmail's zmail-tui:
#   crates/familychat-tui/src/editor.rs (src/editor.rs: the opt-in
#   external editor, its 0700 folder and the overwrite-and-remove) and
#   terminal::resume in crates/familychat-tui/src/terminal.rs
#   (src/terminal.rs). Adapted from Zmail's zmail-tui: the composer's
#   editor settings and plain-key input in
#   crates/familychat-tui/src/composer.rs (src/compose.rs's body_editor and
#   editor_input), and the editor effect in crates/familychat-tui/src/lib.rs
#   (src/lib.rs).
# - Notifications (Phase 9, ADR 0013), same copyright and licence; keep
#   each file's header notice. Adapted from Zmail's zmail-notify
#   (src/lib.rs: the flood cap, its rolling window and its tests) in
#   crates/familychat-notify/src/lib.rs and src/tests.rs, and from
#   zmail-ui's src/notifications.rs (posting through GPUI's system
#   notifications with opaque tags, the click handler) in
#   crates/familychat-ui/src/notifications.rs.
# - The messaging actions and the composer (Phase 7, ADR 0012), same
#   copyright and licence; keep each file's header notice. Adapted from
#   Zmail: the actions service and its events-to-a-callback shape in
#   crates/familychat-actions/src/lib.rs (zmail-actions' lib.rs), the
#   composer's attach picker, dropped files and file cards, and its mention
#   list's keys, in crates/familychat-ui/src/rooms/composer.rs (zmail-ui's
#   compose.rs and compose/recipients.rs). The text input's
#   `submit_on_enter` mode is this project's addition to the ported
#   crates/familychat-ui/src/components/text_input.rs.
# - crates/familychat-ui/src/testdata/signin-qr-screenshot.png is made for
#   this project's tests (python-qrcode and Pillow), under its licence, and
#   crates/familychat-test-support/src/testdata/photo.jpg (a 32x24
#   gradient made with ImageMagick for the location tests) likewise.
# - Packaging (Phase 12, ADR 0014), same copyright and licence; keep each
#   file's header notice. Copied from Zmail: scripts/create-dmg.sh
#   (scripts/create-dmg.sh, names changed). Adapted from Zmail:
#   scripts/generate-app-icon.sh (scripts/generate-app-icon.sh, with Linux
#   and Windows modes added), crates/familychat-app/wix/main.wxs
#   (crates/zmail-app/wix/main.wxs, made per-user), the desktop entry
#   packaging/linux/family.safechat.desktop.desktop
#   (crates/zmail-app/ie.unicornops.zmail.desktop), the .deb metadata in
#   crates/familychat-app/Cargo.toml (zmail-app's), and from the macOS
#   steps of Zmail's .github/workflows/release-please.yml:
#   packaging/macos/Info.plist, scripts/create-macos-bundle.sh and
#   scripts/notarize-macos.sh.
#
# Nothing is copied from the Element X forks (AGPL-3.0); see PLAN.md,
# section 2.

# Bundled assets that are not crates, also recorded here:
#
# - packaging/icons/familychat.svg, the app icon, and what is rendered from
#   it (packaging/windows/familychat.ico, committed; the macOS icns and
#   asset catalog and the Linux hicolor PNGs, made at release time): Family
#   Chat's own mark, the tile and speech bubble of family-chat's
#   website/static/img/favicon.svg (Copyright UnicornOps), redrawn on the
#   1024 px icon grid. Not a third-party asset.
# - assets/fonts/inter/Inter-{Regular,Medium,SemiBold,Bold}.ttf
#   Inter 4.1 (https://github.com/rsms/inter/releases/tag/v4.1, from
#   Inter-4.1.zip, sha256 9883fdd4a49d4fb66bd8177ba6625ef9a64aa45899767dde3d36aa425756b11e),
#   Copyright The Inter Project Authors, licensed under the SIL Open Font
#   License 1.1 (assets/fonts/inter/LICENSE.txt). Copied from Zmail.
#   Embedded in Linux builds only (crates/familychat-assets); release
#   archives ship the licence as licenses/Inter-OFL.txt.
# - assets/icons/*.svg
#   Lucide (https://lucide.dev), licensed under the ISC License; the icons
#   Lucide derives from Feather are also under MIT (assets/icons/LICENSE.txt,
#   copied from the Lucide repository). A subset of Zmail's copy (with minus,
#   square, octagon-alert, clock, refresh-cw and server added from it in
#   Phase 5), plus
#   clipboard-paste, circle-check, circle-pause, globe, house, key-round,
#   link, lock, lock-keyhole, log-out, message-circle-heart, qr-code,
#   scan-qr-code and shield-check from Lucide 1.68.0
#   (https://github.com/lucide-icons/lucide/tree/1.68.0/icons); in Phase 6
#   file, file-image, file-text and trash-2 from Zmail's copy, and
#   arrow-down, arrow-down-to-line, arrow-up, arrow-up-to-line,
#   chevron-left, chevrons-down, chevrons-up, corner-down-right,
#   hourglass, image, image-off, lock-open, mail-plus,
#   message-circle-more, message-square-dashed, messages-square, pencil,
#   shield-off and users from Lucide 1.68.0; in Phase 7 door-open
#   and face-slightly-smiling-plus from Lucide 1.68.0; in Phase 8
#   file-key from Zmail's copy, and laptop, save, smartphone and upload
#   from Lucide 1.68.0. Embedded
#   in all builds; release archives ship the licence as
#   licenses/Lucide-LICENSE.txt.
