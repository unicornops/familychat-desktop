[package]
name = "familychat-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Family Chat desktop client"

[[bin]]
name = "familychat"
path = "src/main.rs"

# Windows only (ADR 0014): what the MSI's Start-menu shortcut and its
# familychat: URL handler start, so Family Chat never opens a console
# window. Elsewhere it only says it isn't used there.
[[bin]]
name = "familychat-launcher"
path = "src/bin/familychat-launcher.rs"

# The .deb (ADR 0014; `cargo deb -p familychat-app --no-build`, which the
# release workflow runs after the release build, scripts/stage-licences.sh
# and `scripts/generate-app-icon.sh linux target/dist/icons`). The
# package and its binary are `familychat`; the desktop entry and the icons
# are named after the app id, family.safechat.desktop.
[package.metadata.deb]
name = "familychat"
maintainer = "UnicornOps <noreply@unicornops.ie>"
copyright = "2026, UnicornOps"
license-file = ["../../LICENSE", "0"]
# $auto reads the libraries the binary links (dpkg-shlibdeps); wgpu loads
# Vulkan, or EGL, at run time.
depends = "$auto, libvulkan1 | libegl1"
# The keychain needs a Secret Service in the session (ADR 0003), and links
# open through xdg-open.
recommends = "gnome-keyring | kwalletmanager | keepassxc, xdg-utils"
section = "net"
priority = "optional"
extended-description = """\
Family Chat is a native desktop client for Family Chat and any other \
Matrix server, with a window and a terminal UI (familychat tui). It signs \
in with a code from a parent, keeps its secrets in the system keychain and \
talks only to the account's homeserver."""
assets = [
    ["target/release/familychat", "usr/bin/", "755"],
    # The desktop entry registers familychat:// links (MimeType); the
    # desktop-file-utils and icon cache triggers pick it and the icons up.
    ["../../packaging/linux/family.safechat.desktop.desktop", "usr/share/applications/", "644"],
    ["../../target/dist/icons/hicolor/16x16/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../target/dist/icons/hicolor/24x24/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../target/dist/icons/hicolor/32x32/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../target/dist/icons/hicolor/48x48/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../target/dist/icons/hicolor/64x64/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../target/dist/icons/hicolor/128x128/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../target/dist/icons/hicolor/256x256/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../target/dist/icons/hicolor/512x512/apps/family.safechat.desktop.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../target/dist/icons/hicolor/scalable/apps/family.safechat.desktop.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # THIRD_PARTY.html (cargo about) and the licences of what the binary
    # embeds: Inter (SIL OFL 1.1), Lucide (ISC/MIT) and the code ported
    # from Zed (Apache-2.0).
    ["../../target/dist/licences/THIRD_PARTY.html", "usr/share/doc/familychat/", "644"],
    ["../../target/dist/licences/licenses/*", "usr/share/doc/familychat/licenses/", "644"],
]

[dependencies]
anyhow.workspace = true
familychat-assets = { path = "../familychat-assets" }
familychat-core = { path = "../familychat-core" }
# The single-instance hand-off (ADR 0013): the window listens on the
# profile's user-only socket or pipe, a second launch forwards to it.
familychat-instance = { path = "../familychat-instance" }
familychat-security = { path = "../familychat-security" }
familychat-session = { path = "../familychat-session" }
# The sign-in flows (ADR 0006) the sign-in screens drive. Never with its
# `staging` or `test-harness` feature in a release build
# (scripts/check-release-features.sh).
familychat-signin = { path = "../familychat-signin" }
familychat-store = { path = "../familychat-store" }
# The screenshot fixtures, only with the `ui-fixture` feature (never in a
# release build: scripts/check-release-features.sh).
familychat-test-support = { path = "../familychat-test-support", optional = true }
familychat-theme = { path = "../familychat-theme" }
familychat-tui = { path = "../familychat-tui", optional = true }
familychat-ui = { path = "../familychat-ui" }
# The background runtime's handle and the startup's oneshot answers.
tokio.workspace = true
tracing.workspace = true
# Wiping a link read from standard input or the command line.
zeroize.workspace = true

[features]
# The terminal UI, `familychat tui`. On by default, so every release has it.
default = ["tui"]
tui = ["dep:familychat-tui"]
# `familychat launch-ui-fixture VIEW [dark|light]`, the window on a fixture
# state for the screenshot matrix (scripts/capture-ui-screenshots.sh), and
# `familychat launch-tui-fixture VIEW`, the terminal UI on one. Off
# by default and never in a release: CI's UI Screenshots job builds with
# it, and scripts/check-release-features.sh fails if the release graph
# reaches familychat-test-support.
ui-fixture = ["dep:familychat-test-support", "familychat-test-support/fixtures", "familychat-tui?/fixture-views"]

[dev-dependencies]
# tests/live_tui_signin.rs and live_tui_writing.rs: the terminal UI's
# sign-in, writing and verification on the homeserver harness, over the
# real sign-in and session (test builds only; the release graph never has
# them: scripts/check-release-features.sh).
crossterm.workspace = true
familychat-signin = { path = "../familychat-signin", features = ["test-harness"] }
familychat-test-support = { path = "../familychat-test-support", features = ["test-harness"] }
ratatui.workspace = true

[build-dependencies]
winresource = "0.1"

[[test]]
name = "live_tui_signin"
required-features = ["tui"]

[[test]]
name = "live_tui_writing"
required-features = ["tui"]

[lints]
workspace = true
