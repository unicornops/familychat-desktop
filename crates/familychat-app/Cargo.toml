[package]
name = "familychat-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Family Chat desktop client"

[[bin]]
name = "familychat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
familychat-assets = { path = "../familychat-assets" }
familychat-core = { path = "../familychat-core" }
familychat-security = { path = "../familychat-security" }
familychat-session = { path = "../familychat-session" }
# The sign-in flows (ADR 0006) the sign-in screens drive. Never with its
# `staging` or `test-harness` feature in a release build
# (scripts/check-release-features.sh).
familychat-signin = { path = "../familychat-signin" }
familychat-store = { path = "../familychat-store" }
# The screenshot fixtures, only with the `ui-fixture` feature (never in a
# release build: scripts/check-release-features.sh).
familychat-test-support = { path = "../familychat-test-support", optional = true }
familychat-theme = { path = "../familychat-theme" }
familychat-tui = { path = "../familychat-tui", optional = true }
familychat-ui = { path = "../familychat-ui" }
# The background runtime's handle and the startup's oneshot answers.
tokio.workspace = true
tracing.workspace = true

[features]
# The terminal UI, `familychat tui`. On by default, so every release has it.
default = ["tui"]
tui = ["dep:familychat-tui"]
# `familychat launch-ui-fixture VIEW [dark|light]`, the window on a fixture
# state for the screenshot matrix (scripts/capture-ui-screenshots.sh). Off
# by default and never in a release: CI's UI Screenshots job builds with
# it, and scripts/check-release-features.sh fails if the release graph
# reaches familychat-test-support.
ui-fixture = ["dep:familychat-test-support", "familychat-test-support/fixtures"]

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
