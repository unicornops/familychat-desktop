[package]
name = "familychat-session"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Family Chat's background runtime and Matrix sessions: the account manager, sync, room lists and timelines"

[dependencies]
anyhow.workspace = true
familychat-core = { path = "../familychat-core" }
familychat-security = { path = "../familychat-security" }
familychat-store = { path = "../familychat-store" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
matrix-sdk.workspace = true
# The attachment decryptor for encrypted media (`media`), which matrix-sdk
# does not re-export. Already in the graph under matrix-sdk; pinned exactly
# and moved with the other Matrix crates.
matrix-sdk-base = { version = "=0.19.1", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-ui.workspace = true
# Our own HTTP client for matrix-sdk (ADR 0005): the reqwest line it uses.
reqwest.workspace = true
# A media handle is the source's JSON (the mxc address, and an encrypted
# file's key), opaque to the frontends (`mapping::handle`).
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The live tests' HTTP client trusts the harness CA and resolves only the
# harness hosts; it is injected through `SessionConfig::http_client`, so
# nothing in this crate trusts the CA itself (ADR 0004).
familychat-test-support = { path = "../familychat-test-support", features = ["test-harness"] }
tracing-subscriber.workspace = true
# The mocked homeserver for the tests that need no harness.
wiremock = "0.6.5"

[[test]]
name = "live_session"

[lints]
workspace = true
