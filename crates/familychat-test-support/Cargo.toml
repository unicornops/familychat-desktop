[package]
name = "familychat-test-support"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Test support for Family Chat: the screenshot and view-test fixtures, and the live homeserver harness driver with its test-only HTTP client"

[features]
# FixtureSession, FixtureSignin and FixtureStartup, for the window's view
# tests and `familychat launch-ui-fixture` (an opt-in feature of
# familychat-app, never in a release build: scripts/check-release-features.sh).
# No network, keychain or disk; the sentences are the sign-in's and the
# store's own.
fixtures = ["dep:familychat-core", "dep:familychat-security", "dep:familychat-signin", "dep:familychat-store", "dep:tokio"]
# The harness driver and its HTTP client, which trusts the harness's
# throwaway CA and resolves the harness hostnames to loopback. Test builds
# only: a release build with it on fails to compile, and CI checks that no
# release build of familychat-app can reach it
# (scripts/check-release-features.sh, ADR 0004).
test-harness = ["dep:reqwest", "dep:serde_json", "dep:tokio"]

[dependencies]
anyhow.workspace = true
familychat-core = { path = "../familychat-core", optional = true }
familychat-security = { path = "../familychat-security", optional = true }
familychat-signin = { path = "../familychat-signin", optional = true }
familychat-store = { path = "../familychat-store", optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests (the unit tests and tests/live_homeserver_harness.rs)
# build with the harness on, so the workspace-wide clippy and test runs
# compile the driver; nothing outside test builds sees the feature.
familychat-test-support = { path = ".", features = ["fixtures", "test-harness"] }
tokio.workspace = true

[[test]]
name = "live_homeserver_harness"
required-features = ["test-harness"]

[lints]
workspace = true
