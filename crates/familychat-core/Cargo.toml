[package]
name = "familychat-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Family Chat's domain types and view models, shared by both frontends"

[dependencies]
# Day dividers and message times in the local time zone (timeline wording).
# Already in the graph through GPUI and matrix-sdk-ui; the clock feature only.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Matrix identifiers only (room, user and event ids), from the ruma line
# matrix-sdk uses; no API, events or network (PLAN.md, section 5.1).
ruma.workspace = true
# The runtime-agnostic channels the session sends view models over
# (oneshot, mpsc, watch): Tokio's sync primitives work on any executor, so
# GPUI tasks await them and the terminal UI polls them. No runtime, timer
# or I/O feature.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Parsing link targets (`links`): the URL parser ruma itself uses.
url = "2.5"
# Wiping the sign-in's secrets in transit (`signin::SecretText`).
zeroize.workspace = true

[lints]
workspace = true
