# The harness's TLS front end (ADR 0004). Every host listens on 8443 with
# the same certificate, which the harness script signs with a throwaway CA
# on every `up`; the test client resolves each host to the published port.
#
# hs1.familychat.test is a Family Chat family's edge proxy, copied from
# family-chat's render_nginx_edge_config
# (control-panel/apps/provisioning/homeserver_config.py) with no approved
# federation peers: only the well-known documents, the client, media and key
# APIs and gated federation reach Palpo; everything else, including
# /_synapse/, is a 404. Keep it in step with that function.

pid /tmp/nginx.pid;
events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    # family-chat's format plus the host, so a test can see which harness
    # host a client contacted.
    log_format main '$host $remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    # The same requests in a file the tests read
    # (HomeserverHarness::access_log): the host, the method, the path
    # without its query, and the status, one request per line. The sign-in
    # tests prove from it which host a token or a password went to, and
    # that a host never saw one.
    log_format evidence '$host $request_method $uri $status';
    access_log /var/log/harness/access.log evidence;
    error_log /dev/stderr warn;

    ssl_certificate /etc/nginx/tls/server.pem;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    upstream homeserver {
        server palpo:8008;
    }

    upstream synapse {
        server synapse:8008;
    }

    upstream synapse_mas {
        server synapse-mas:8008;
    }

    upstream mas {
        server mas:8080;
    }

    map_hash_bucket_size 256;

    map $http_authorization $matrix_origin {
        default "";
        '~*\borigin="?([^",]+)"?' $1;
    }

    # No approved federation peers.
    map $matrix_origin $allowed {
        default 0;
    }

    # Any other name: refuse, so a typo in a test is loud.
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 421;
    }

    # A Family Chat family (allowlisted under the test-harness feature's
    # *.familychat.test), served by Palpo.
    server {
        listen 8443 ssl;
        server_name hs1.familychat.test;

        # Public discovery endpoints — must stay reachable for federation to find us.
        location /.well-known/matrix/client {
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
        }

        location /.well-known/matrix/server {
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
        }

        location /_matrix/key/ {
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
        }

        location /_matrix/client/ {
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /_matrix/media/ {
            client_max_body_size 11m;
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /_matrix/federation/ {
            if ($allowed = 0) {
                return 403;
            }
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404;
        }
    }

    # A bring-your-own-domain family's domain: it serves only the two
    # well-known documents, delegating to the family's serving host, as
    # family-chat's domain verification expects
    # (control-panel/apps/provisioning/domain_verification.py).
    server {
        listen 8443 ssl;
        server_name smith.test;

        location = /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            return 200 '{"m.homeserver":{"base_url":"https://hs1.familychat.test"}}';
        }

        location = /.well-known/matrix/server {
            default_type application/json;
            return 200 '{"m.server":"hs1.familychat.test:443"}';
        }

        location / {
            return 404;
        }
    }

    # A working homeserver outside the Family Chat allowlist: the same Palpo
    # behind a host a crafted link or a typed address could name. Its
    # well-known points at itself. Sign-in tests prove the client refuses it
    # before sending a token or a password (the access log shows the host).
    server {
        listen 8443 ssl;
        server_name evil.familychat.example;

        location = /.well-known/matrix/client {
            default_type application/json;
            return 200 '{"m.homeserver":{"base_url":"https://evil.familychat.example"}}';
        }

        location /_matrix/client/ {
            proxy_pass http://homeserver;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }

    # A Family Chat host (allowlisted) whose login answers with a 307 to
    # the non-allowlisted host: a client that followed it would re-send the
    # token or the password there. Everything else is hs1's Palpo, so
    # discovery works.
    server {
        listen 8443 ssl;
        server_name redirect.familychat.test;

        location = /_matrix/client/v3/login {
            return 307 https://evil.familychat.example/_matrix/client/v3/login;
        }

        location /_matrix/client/ {
            proxy_pass http://homeserver;
            proxy_set_header Host hs1.familychat.test;
        }

        location / {
            return 404;
        }
    }

    # Synapse, for "any homeserver" coverage.
    server {
        listen 8443 ssl;
        server_name synapse.test;

        location /_matrix/ {
            client_max_body_size 50m;
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /_synapse/client/ {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 404;
        }
    }

    # Synapse with MAS (Phase 14, ADR 0010), allowlisted: a family as
    # family-chat #239 plans it. With MAS, the client API's login, logout
    # and refresh are MAS's compatibility layer (password and single
    # sign-on logins for clients without OAuth); everything else, the
    # auth metadata and the MSC4108 rendezvous included, is Synapse's.
    server {
        listen 8443 ssl;
        server_name synapse-mas.familychat.test;

        location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/(login|logout|refresh)(/.*)?$ {
            proxy_pass http://mas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^(/_matrix|/_synapse/client|/\.well-known/matrix) {
            client_max_body_size 50m;
            proxy_pass http://synapse_mas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 404;
        }
    }

    # MAS, the authorization server (its issuer): the browser pages, the
    # OAuth endpoints and the admin API the tests make users with.
    server {
        listen 8443 ssl;
        server_name mas.familychat.test;

        location / {
            proxy_pass http://mas;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
