# The local homeserver harness (ADR 0004). Start it with
# `scripts/homeserver-harness.sh up`, never with `docker compose up` alone:
# the script makes the throwaway CA, renders palpo.toml with a fresh
# registration token into the state directory, generates Synapse's config
# and bootstraps the admin bot before the tests can use it.
#
# Images are pinned by tag and digest; docs/upstream/homeservers.md says how
# to move them, and how to follow the Palpo image Family Chat runs.

name: familychat-homeserver-harness

services:
  # Palpo's PostgreSQL sidecar, as family-chat's PalpoType runs it: trust
  # auth for the palpo user, PGDATA in a subdirectory, reachable only on the
  # harness network (the family pod keeps it on localhost).
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: palpo
      POSTGRES_DB: palpo
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The MAS database (Phase 14), made with the data directory.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "palpo", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Palpo at the image family-chat pins (PALPO_IMAGE in its
  # infra/kubernetes/platform/configmap.yaml). The image's default command
  # runs, with PALPO_CONFIG pointing at the mounted config, as the family
  # pod does. Its plain HTTP listener is published on loopback for the
  # admin API only, standing in for the control panel's port-forward; client
  # traffic goes through the edge like a family's does.
  palpo:
    image: ghcr.io/unicornops/palpo:sha-b188d47@sha256:cb50e0fb431d616980a1e4425115dc4039fab7dedbd8e1e3c4de808663842493
    environment:
      PALPO_CONFIG: /etc/palpo/palpo.toml
    volumes:
      - ${FAMILYCHAT_HARNESS_STATE_DIR:?run scripts/homeserver-harness.sh up}/palpo.toml:/etc/palpo/palpo.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FAMILYCHAT_HARNESS_ADMIN_PORT:-18008}:8008"

  # Synapse, pinned, for "any homeserver" coverage. Its config is made by
  # the image's own `generate` mode into the synapse-data volume, and the
  # script appends the harness's settings (refresh tokens, rate limits).
  # Its plain HTTP listener is published on loopback for its admin API
  # only, as Palpo's is; client traffic goes through the edge.
  synapse:
    image: matrixdotorg/synapse:v1.164.2@sha256:f0df87cff259872637b4b5e5174b9977e5e3046dd421505407803b5e45c5f842
    environment:
      SYNAPSE_SERVER_NAME: synapse.test
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapse-data:/data
    ports:
      - "127.0.0.1:${FAMILYCHAT_HARNESS_SYNAPSE_ADMIN_PORT:-18009}:8008"

  # Synapse delegating its sign-in to MAS (Phase 14, ADR 0010): OAuth 2.0
  # (MSC3861), the device authorization grant and the MSC4108 rendezvous
  # for QR code sign-in, as family-chat #239 plans for each family. The same
  # pinned image as `synapse`; its config is generated the same way and
  # the script appends the MAS settings. No published port: MAS manages its
  # users, and the tests reach both only through the edge.
  synapse-mas:
    image: matrixdotorg/synapse:v1.164.2@sha256:f0df87cff259872637b4b5e5174b9977e5e3046dd421505407803b5e45c5f842
    environment:
      SYNAPSE_SERVER_NAME: synapse-mas.familychat.test
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapse-mas-data:/data

  # Matrix Authentication Service, pinned: the OAuth 2.0 authorization
  # server synapse-mas delegates to. Its config (fresh secrets and keys on
  # every `up`) is rendered into the state directory by the script; the
  # database is on the Postgres sidecar. `server` runs its migrations.
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.28.0@sha256:494c67f08ee8344368f4ed336611dea02b26c4e058bf37a212d090d50b612659
    environment:
      MAS_CONFIG: /etc/mas/config.yaml
    volumes:
      - ${FAMILYCHAT_HARNESS_STATE_DIR:?run scripts/homeserver-harness.sh up}/mas:/etc/mas:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The TLS front end: one nginx serving every harness host on 8443 with a
  # certificate from the throwaway CA the script makes on every `up`.
  # hs1.familychat.test is a Family Chat family's edge proxy (the paths
  # family-chat's render_nginx_edge_config exposes), smith.test a custom
  # domain that only publishes the well-known delegation,
  # evil.familychat.example a working homeserver outside the allowlist, and
  # redirect.familychat.test an allowlisted host whose login answers 307,
  # synapse-mas.familychat.test Synapse with MAS and mas.familychat.test
  # MAS itself.
  edge:
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FAMILYCHAT_HARNESS_STATE_DIR:?run scripts/homeserver-harness.sh up}/tls:/etc/nginx/tls:ro
      # The access log the tests read (HomeserverHarness::access_log).
      - ${FAMILYCHAT_HARNESS_STATE_DIR:?run scripts/homeserver-harness.sh up}/edge-logs:/var/log/harness
    depends_on:
      - palpo
      - synapse
      - synapse-mas
      - mas
    ports:
      - "127.0.0.1:${FAMILYCHAT_HARNESS_EDGE_PORT:-18443}:8443"

volumes:
  postgres-data:
  synapse-data:
  synapse-mas-data:
